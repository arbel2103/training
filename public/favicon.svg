<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <rect width="256" height="256" rx="60" fill="#e4572e"/>
  <circle cx="128" cy="128" r="98" fill="none" stroke="#fff" stroke-width="6" opacity="0.9"/>
  <!-- radial dividers into three wedges: swim (upper-left), run (upper-right), bike (bottom) -->
  <g stroke="#fff" stroke-width="6" opacity="0.9" stroke-linecap="round">
    <line x1="128" y1="128" x2="128" y2="34"/>
    <line x1="128" y1="128" x2="209" y2="175"/>
    <line x1="128" y1="128" x2="47" y2="175"/>
  </g>
  <g fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <!-- swim: crawl swimmer (upper-left wedge) -->
    <g>
      <circle cx="66" cy="88" r="7" fill="#fff" stroke="none"/>
      <path d="M60 98 q14 -9 27 -3"/>
      <path d="M52 108 q8 -6 16 0 t16 0" stroke-width="7"/>
    </g>
    <!-- run: running figure (upper-right wedge) -->
    <g>
      <circle cx="182" cy="76" r="7" fill="#fff" stroke="none"/>
      <path d="M179 84 L171 102"/>
      <path d="M171 102 L185 108 L181 122"/>
      <path d="M171 102 L160 110 L164 122"/>
      <path d="M176 90 L189 94"/>
      <path d="M176 90 L164 86"/>
    </g>
    <!-- bike: bicycle (bottom wedge) -->
    <g>
      <circle cx="104" cy="192" r="17"/>
      <circle cx="160" cy="192" r="17"/>
      <path d="M104 192 L124 166 L152 166 L160 192 M124 166 L136 192 L152 166"/>
    </g>
  </g>
</svg>
